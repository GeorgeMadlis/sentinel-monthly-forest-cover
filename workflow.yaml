divergences:
- 'Partial v2 coverage: emits provisional disturbance candidates; temporal persistence
  and confirmed forest-state labels are not implemented.'
- Terrain flattening and speckle filtering are external prerequisites, not implemented
  here.
- Default optical median and SAR configurable mean/median; reference uses declared
  period-composites or legacy pooled-observations.
- NDVI anomaly and seasonal decision thresholds are experimental user parameters,
  not canonical validated thresholds.
- Weighted confidence is a weighted candidate-vote score, not calibrated probability.
- No automatic S1-only fallback; select sar_only explicitly. Missing evidence is preserved
  as nodata.
- Minimum component filtering uses 8-connectivity with bounded halos; no causal attribution.
