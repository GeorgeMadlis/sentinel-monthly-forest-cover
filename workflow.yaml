divergences:
- 'Partial v2 coverage: emits provisional disturbance candidates; temporal persistence and
  confirmed forest-state labels are not implemented.'
- Terrain flattening and speckle filtering are external prerequisites, not implemented here.
- Default optical median and SAR configurable mean/median; reference uses declared period-composites
  or legacy pooled-observations.
- NDVI anomaly and seasonal decision thresholds are experimental user parameters, not canonical
  validated thresholds.
- Weighted confidence is a weighted candidate-vote score, not calibrated probability.
- No automatic S1-only fallback; select sar_only explicitly. Missing evidence is preserved
  as nodata.
- Minimum component filtering uses 8-connectivity with bounded halos; no causal attribution.
- Temporal aggregation (method capability capability:labeled-array-aggregation) uses NumPy
  arrays, which have no Forest Cover Lab tool record; tool:xarray is not used.
- method:s1-backscatter-confirmation is implemented only as per-window SAR candidate evidence;
  observation:disturbance-confirmation is not produced.
- method:moving-window-comparison lists observation:temporal-persistence; windows are compared
  independently and no persistence observation is produced.
- NDMI, NBR and VV_MINUS_VH_DB are implementation features without Forest Cover Lab measurement
  records; only NDVI maps to measurement:ndvi.
- Monthly, moving-window and matched-season modes, window sizes, steps and reference statistics
  are run configuration, not canonical scientific defaults.
