schema_version: '1.1'
round_id: road-like-ndvi-2025-2026-monthly-round-0002
kind: comparison
status: planned
created_utc: '2026-10-23T10:32:17.342790+00:00'
question: Do two road-like year-over-year NDVI anomalies indicate new construction,
  maintenance, adjacent vegetation change, or sensor/seasonal artifacts in monthly
  2025 vs 2026 data?
frame:
  aoi_ref: 'inputs/aoi.geojson; unchanged configs/aoi.example.geojson at Sentinel
    2f512fec185d1290ab5203c8892231f2d5c219be; ROIs: inputs/prior_rois.geojson copied
    unchanged from historical review, overlay QA pending'
  period: Baseline June [2025-06-01,2025-07-01) UTC; target June [2026-06-01,2026-07-01)
    UTC; July/August and prior years sensitivity only
  measurement: Per-pixel month-mean NDVI on common valid grid (median as sensitivity);
    absolute and masked relative change, road interior vs adjacent vegetation, forest
    mask only when a separately approved baseline is available; candidate hectares
    are not validated forest loss
  competing_hypotheses:
  - Pre-existing road and phenological/roadside vegetation difference
  - Pre-existing road widened or maintained in 2025-2026
  - New connecting alignment or adjacent clearing
  - Railway/utility/forestry track misidentified as road
  - Atmospheric/cloud/BRDF/calibration/registration or compositing artifact
  - Actual forest disturbance outside pre-existing road footprint
