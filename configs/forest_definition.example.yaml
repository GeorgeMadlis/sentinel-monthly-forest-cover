forest_definition:
  mask_source: hansen
  treecover2000_threshold_percent: 30
  include_loss_up_to_reference_year: true
  notes: >
    This forest definition is intended for monthly disturbance confirmation.
    It should be reviewed for biome-specific adjustments.

mask_rules:
  require_datamask: true
  exclude_water_if_available: true

quality:
  require_min_observations_per_pixel: 2
  reject_tile_if_valid_pixel_ratio_below: 0.6
