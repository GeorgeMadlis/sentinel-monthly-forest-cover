# Template: replace catalogue, assets, preprocessing and baseline with reviewed inputs.
aoi_id: example-aoi
application: application:seasonal-forest-change-monitoring
execution:
  backend: local-python
  crs: EPSG:6933
  max_observations_per_window: 256
  resolution: 20
  tile_size: 256
forest_mask:
  dataset: DS-0001
  path: ../data/approved-baseline.tif
  reference_year: 2025
  threshold: 1
  transformation: threshold-gte
  version: declare-source-version
fusion:
  mode: optical_and_sar
observations:
  optical:
    dataset: DS-0002
    features:
    - NDVI
    - NDMI
    - NBR
    quality:
      mode: scl
      valid_classes:
      - 4
      - 5
      - 6
      - 7
    version: declare-collection-edition-and-calibration
  sar:
    aggregation: mean
    dataset: DS-0003
    features:
    - VV
    - VH
    preprocessing:
      instrument_mode: IW
      orbit_direction: ascending
      relative_orbit: 42
      speckle_treatment: upstream-review-required
      terrain_flattening: upstream-review-required
    thresholds:
      VV: -1.5
      VH: -1
    units: db
    version: declare-processing-edition
output:
  export_quicklooks: true
  prefix: runs/regional-seasonal-example
providers:
  optical:
    type: stac
    endpoint: https://your-catalogue.example/stac
    collection: your-sentinel-2-l2a-collection
    asset_map:
      red: red
      nir: nir
      swir1: swir16
      swir2: swir22
      scl: scl
    filters: {}
  sar:
    type: local
    inventory: ../data/sar-observations.json
    collection: preprocessed-s1-track-42
run_id: regional-seasonal-example
schema_version: '2.0'
temporal:
  aggregation: median
  alignment: calendar-date
  mode: matched-season-moving-window
  reference_periods:
  - end: '2024-08-31'
    start: '2024-06-01'
  - end: '2025-08-31'
    start: '2025-06-01'
  reference_statistic: period-composites
  target:
    end: '2026-08-31'
    start: '2026-06-01'
  window_days: 30
  step_days: 10
threshold:
  min_component_pixels: 1
  min_valid_pixel_ratio: 0
  mode: fixed
  value: -0.2
